name: CI/CD Pipeline

on:
  push:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # FRONTEND
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm install

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Create issue on test failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 CI/CD Test Failed - ${context.workflow} #${context.runNumber}`,
              body: `## Test Failure Report
              
              **Workflow:** ${context.workflow}
              **Run Number:** ${context.runNumber}
              **Branch:** ${context.ref}
              **Commit:** ${context.sha}
              **Actor:** @${context.actor}
              
              ### Failed Job Details
              - **Job:** ${context.job}
              - **Run ID:** ${context.runId}
              
              ### Action Required
              Please check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for detailed logs.
              
              **Triggered by:** ${context.eventName}
              **Timestamp:** ${new Date().toISOString()}`,
              labels: ['bug', 'ci-failure', 'automated']
            });
            console.log(`Created issue #${issue.data.number}`);
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}