networks:
  app-network:
    driver: bridge

services:
  eureka-server:
    build: ./backend/eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - app-network
    env_file:
      - ./backend/eureka-server/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/eureka/apps"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  user-service:
    build: ./backend/user-service
    container_name: user-service
    networks:
      - app-network
    env_file:
      - ./backend/user-service/.env
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: on-failure

  auth-service:
    build: ./backend/auth-service
    container_name: auth-service
    networks:
      - app-network
    env_file:
      - ./backend/auth-service/.env
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: on-failure

  product-service:
    build: ./backend/product-service
    container_name: product-service
    networks:
      - app-network
    env_file:
      - ./backend/product-service/.env
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: on-failure

  category-service:
    build: ./backend/category-service
    container_name: category-service
    networks:
      - app-network
    env_file:
      - ./backend/category-service/.env
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: on-failure

  brand-service:
    build: ./backend/brand-service
    container_name: brand-service
    networks:
      - app-network
    env_file:
      - ./backend/brand-service/.env
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: on-failure

  order-service:
    build: ./backend/order-service
    container_name: order-service
    networks:
      - app-network
    env_file:
      - ./backend/order-service/.env
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: on-failure

  payment-service:
    build: ./backend/payment-service
    container_name: payment-service
    networks:
      - app-network
    env_file:
      - ./backend/payment-service/.env
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: on-failure

  cart-service:
    build: ./backend/cart-service
    container_name: cart-service
    networks:
      - app-network
    env_file:
      - ./backend/cart-service/.env
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: on-failure

  chat-service:
    build: ./backend/chat-service
    container_name: chat-service
    networks:
      - app-network
    env_file:
      - ./backend/chat-service/.env
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: on-failure

  assistant-service:
    build: ./backend/assistant-service
    container_name: assistant-service
    networks:
      - app-network
    env_file:
      - ./backend/assistant-service/.env
    depends_on:
      eureka-server:
        condition: service_healthy
      n8n:
        condition: service_started
    restart: on-failure

  api-gateway:
    build: ./backend/api-gateway
    container_name: api-gateway
    ports:
      - "8090:8090"
    networks:
      - app-network
    env_file:
      - ./backend/api-gateway/.env
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: on-failure

  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    networks:
      - app-network
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_RUNNERS_ENABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_HIRING_BANNER_ENABLED=false
    volumes:
      - ./n8n:/home/node/.n8n
    restart: always

volumes:
  n8n_data: